[build]
  command = "npm run netlify:build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --production=false"
  NITRO_PRESET = "netlify"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions-internal/server"
  status = 200
  force = true
  
[functions]
  directory = ".netlify/functions-internal"

[dev]
  framework = "nuxt"
  command = "npm run dev"
  port = 3000
  targetPort = 3000