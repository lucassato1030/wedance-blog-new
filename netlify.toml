[build]
  command = "mkdir -p .output/public && npm run prisma:setup && npm run build"
  publish = ".output/public"
  functions = ".output/server"

[build.environment]
  NODE_VERSION = "20"

# API redirects - redirect all API requests to our Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# tRPC redirects
[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200

# For SSR - this redirects all requests to the Netlify function that handles SSR
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200 