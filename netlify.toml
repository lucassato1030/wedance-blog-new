[build]
  command = "mkdir -p .output/public && npm run prisma:setup && npm run build"
  publish = ".output/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API redirects - redirect all API requests to our Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# tRPC redirects
[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200

# For Nuxt SSR - redirect all other requests to the Nuxt handler
[[redirects]]
  from = "/*"
  to = "/.netlify/builders/server"
  status = 200 