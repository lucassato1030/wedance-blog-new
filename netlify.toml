[build]
  command = "npm run prisma:setup && npm run build"
  publish = "dist"
  functions = ".netlify/functions-internal/server"

[build.environment]
  NODE_VERSION = "20"

# API redirects - redirect all API requests to our custom Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# tRPC redirects
[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200

# For Nuxt SSR - redirect all requests to the Netlify Nitro server function
[[redirects]]
  from = "/*"
  to = "/.netlify/builders/.netlify/functions-internal/server"
  status = 200 